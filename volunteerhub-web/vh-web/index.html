<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolunteerHub</title>
<meta name="description" content="Find volunteer shifts, coordinate events, and track approved service hours for schools and nonprofits.">
<link rel="preload" href="fonts/bitter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/open-agenda.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body>
<!-- The app draws itself into #app. #modal holds pop-up forms; #toast shows short messages. -->
<div id="app"></div>
<div id="modal"></div>
<div id="connection-status" class="sr-only" role="status"></div>
<div id="operation-status" class="sr-only" role="status"></div>
<div id="toast" aria-live="polite" role="status"></div>

<!-- Load order matters: helpers and data first, screens next, app.js last. -->
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/zipdata.js"></script>
<script src="js/geo.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/db.js"></script>
<script src="js/cloud.js"></script>
<script src="js/clubs.js"></script>
<script src="js/validation.js"></script>
<script src="js/components.js"></script>
<script src="js/loading.js"></script>
<script src="js/views/landing.js"></script>
<script src="js/views/auth.js"></script>
<script src="js/views/volunteer.js"></script>
<script src="js/website.js"></script>
<script src="js/views/coordinator.js"></script>
<script src="js/views/help.js"></script>
<script src="js/views/news.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/organizers.js"></script>
<script src="js/views/clubs.js"></script>
<script src="js/tour.js"></script>
<script src="js/actions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
